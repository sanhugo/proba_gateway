# Общие настройки для всех окружений. Различия вынесены в application-{local,dev,prod}.yaml
spring:
  application:
    name: gateway
  profiles:
    default: local

  data:
    redis:
      port: 6379
      password: ${REDIS_PASSWORD}

  session:
    timeout: 30m

  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: gateway
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - TokenRelay=
            - RemoveRequestHeader=Cookie
          routes:
            - id: example-service
              uri: ${gateway.services.example-url}
              predicates:
                - Path=/api/example/**

server:
  port: 8080
  shutdown: graceful
  reactive:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
